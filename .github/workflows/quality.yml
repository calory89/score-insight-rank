name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx tsc -p tsconfig.node.json --noEmit
      - run: npm test
      - run: node --test tests/auth-email.test.mjs tests/community-db.test.mjs tests/buyer-operations-db.test.mjs
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      # 15-nov-2026 (seo/tech). The build above already stopped on a broken house rule or a blown speed budget
      # (dist/seo-audit.json: failures); these print what it found so a reviewer sees the warnings too.
      - name: SEO and speed report of this build
        if: ${{ !cancelled() }}
        run: node seo/tech/ciSummary.mjs
      - name: Thumbnail script self-test
        run: python3 scripts/make_thumbs.py --selftest
