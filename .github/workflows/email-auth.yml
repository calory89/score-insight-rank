name: email-auth
on:
  push:
    paths: [".github/workflows/email-auth.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/VosNR/fix10.zip -o fix10.zip
          echo "203ba6033c542fc17c5b50790d462958  fix10.zip" | md5sum -c
          mkdir -p _fix10
          unzip -o fix10.zip -d _fix10
          cp _fix10/AuthModal.tsx src/components/realhunt/AuthModal.tsx
          cp _fix10/Callback.tsx src/pages/auth/Callback.tsx
          cp _fix10/patch_nogoogle.py patch_nogoogle.py
      - name: patch
        run: python3 patch_nogoogle.py
      - name: syntax-check
        run: |
          for f in src/components/realhunt/AuthModal.tsx src/pages/auth/Callback.tsx src/pages/auth/SignIn.tsx src/pages/auth/SignUp.tsx src/components/LoginGateModal.tsx; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: no-google-left
        run: |
          left=$(grep -rn "signInWithOAuth\|Continue with Google" src/ --exclude-dir=integrations || true)
          echo "${left:-(none in app code)}"
          if [ -n "$left" ]; then echo "FAIL: a Google sign-in entry point is still wired up"; exit 1; fi
      - name: commit
        run: |
          rm -rf fix10.zip _fix10 patch_nogoogle.py .github/workflows/email-auth.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Auth: drop Google from all three sign-in surfaces. Email, confirmation link, then choose a password"
          git push
