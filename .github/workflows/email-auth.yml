name: email-auth
on:
  push:
    paths: [".github/workflows/email-auth.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/eDdbi/fix9.zip -o fix9.zip
          echo "752feea77f066d3635c0d5d456b79c35  fix9.zip" | md5sum -c
          mkdir -p _fix9
          unzip -o fix9.zip -d _fix9
          cp _fix9/AuthModal.tsx src/components/realhunt/AuthModal.tsx
          cp _fix9/Callback.tsx src/pages/auth/Callback.tsx
          cp _fix9/patch_nogoogle.py patch_nogoogle.py
      - name: patch
        run: python3 patch_nogoogle.py
      - name: syntax-check
        run: |
          for f in src/components/realhunt/AuthModal.tsx src/pages/auth/Callback.tsx src/pages/auth/SignIn.tsx src/pages/auth/SignUp.tsx; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: no-google-left
        run: |
          ! grep -rn "signInWithOAuth\|Continue with Google" src/ || (echo "Google sign-in still referenced" && exit 1)
      - name: commit
        run: |
          rm -rf fix9.zip _fix9 patch_nogoogle.py .github/workflows/email-auth.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Auth: drop Google entirely. Email, confirmation link, then choose a password"
          git push
