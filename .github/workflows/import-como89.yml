name: import-como89
on:
  push:
    paths: ['.github/workflows/import-como89.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST -o payload.zip https://temp.sh/KyfsC/como.zip
          echo '4d79d712c62d8e5b402ce7b5a746669a  payload.zip' | md5sum -c
          unzip -o payload.zip
          rm payload.zip .github/workflows/import-como89.yml
          ls public/finds | grep lake-como-plesio
      - name: commit
        run: |
          git config user.name 'realhunt-bot'
          git config user.email 'bot@realhunt.co'
          git add -A
          git commit -m 'Add Lake Como Plesio photos'
          git push
