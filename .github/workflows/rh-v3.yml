name: rh-v3
on:
  push:
    paths: [.github/workflows/rh-v3.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -o /tmp/v3.zip https://litter.catbox.moe/lkzgyj.zip
          echo "03cc5dea5aaea5633549adf5e7dee290  /tmp/v3.zip" | md5sum -c -
          mkdir -p /tmp/v3 && unzip -o -q /tmp/v3.zip -d /tmp/v3
      - name: apply
        run: python3 /tmp/v3/patch_v3.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/extras.tsx src/community/map.tsx src/components/realhunt/AuthModal.tsx src/components/realhunt/OriginalListingLink.tsx src/App.tsx vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'rh-prerender-pages' vite.config.ts
          grep -q 'community_feed' src/community/extras.tsx
          grep -q 'hunt-keepgoing' src/community/Community.tsx
          grep -q 'Continue with Google' src/components/realhunt/AuthModal.tsx
          test "$(ls public/og/deal | wc -l)" -ge 100
          test -s src/data/deal-meta.json
      - name: commit
        run: |
          rm -f .github/workflows/rh-v3.yml ops/dump.txt
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v3: share previews per home, filters, map, swipe, daily drop with early access, real cost, gallery, similar homes, ask the seller, help buying, guides, country pages, hunters board, invites, public collections, alerts, Google sign-in, languages, install app"
          git push
