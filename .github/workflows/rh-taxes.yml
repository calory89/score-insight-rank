name: rh-taxes
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-translate every country"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["public/data/taxes.json"]
permissions:
  contents: write
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translate taxes to Spanish with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/taxes_translate.py $([ "${{ github.event.inputs.force }}" = "true" ] && echo --force)
      - name: Commit
        run: |
          git config user.name "realhunt-bot"; git config user.email "bot@realhunt.co"
          git add public/data/taxes.json
          git diff --cached --quiet || (git commit -m "Taxes: Spanish translation [skip ci]" && git pull --rebase && git push)
