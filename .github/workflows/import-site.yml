name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/YINhn/site17.zip -o site.zip
          echo "f683c895686c397202a3a5bfdc4d161b  site.zip" | md5sum -c -
          unzip -oq site.zip
          test -f public/og/index.json
          grep -q "go.realhunt.co" src/pages/FindDetail.tsx
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: per-home share cards (public/og) + share links via go.realhunt.co"
          git push
