name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/IfBky/site14.zip -o site.zip
          echo "6ce0d3dc8ca3ccd3204dd7d81daba322  site.zip" | md5sum -c -
          unzip -oq site.zip
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "fix: modals and cookie banner rendered in a portal, OSM tiles on the map"
          git push
