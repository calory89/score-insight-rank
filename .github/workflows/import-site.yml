name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/TnnzX/site5.zip -o site.zip
          echo "a19482d97b9dd3f663b82db1b38ac209  site.zip" | md5sum -c -
          unzip -oq site.zip
          python3 - <<'PY'
          a='src/App.tsx'; t=open(a).read()
          if 'pages/Ebc"' not in t:
              k=t.index("const Home = React.lazy("); t=t[:k]+"const Ebc = React.lazy(() => import(\"./pages/Ebc\"));\n"+t[k:]
              r=t.index('<Route path="/network"'); t=t[:r]+'<Route path="/ecobeachcity" element={<Ebc />} />\n        '+t[r:]
          assert 'pages/Ebc"' in t and '/ecobeachcity' in t
          open(a,'w').write(t); print('app ok')
          PY
          rm -f site.zip public/sync.txt .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: image-first home with country/beach filters, EBC cabin page, visual network funnel, enhanced photos"
          git push
