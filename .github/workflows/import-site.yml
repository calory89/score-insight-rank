name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/GBQiy/site3.zip -o site.zip
          echo "484f4263683017bbfac26017b20032ea  site.zip" | md5sum -c -
          unzip -oq site.zip
          python3 - <<'PY'
          p='src/App.tsx'; s=open(p).read()
          a='const AdminActivity = React.lazy(() => import("./pages/AdminActivity"));'
          c='          <Route path="/finds" element={<PageTransition><Finds /></PageTransition>} />'
          assert s.count(a)==1 and s.count(c)==1 and 'FindDetail' not in s
          s=s.replace(a, a+'\nconst FindDetail = React.lazy(() => import("./pages/FindDetail"));')
          s=s.replace(c, c+'\n          <Route path="/find/:shortcode" element={<PageTransition><FindDetail /></PageTransition>} />')
          open(p,'w').write(s)
          n='src/components/realhunt/RHNav.tsx'; t=open(n).read()
          for old in ['  { to: "/finds", label: "Spotted" },\n','  { to: "/deals", label: "Deals" },\n']:
              assert t.count(old)==1; t=t.replace(old,'')
          open(n,'w').write(t)
          si='src/pages/auth/SignIn.tsx'; q=open(si).read()
          old='  const handleGoogle = async () => {\n    setLoading(true);'
          assert q.count(old)==1
          q=q.replace(old,'  const handleGoogle = async () => {\n    setLoading(true);\n    try { sessionStorage.setItem("rh_redirect", redirectTo); } catch {}')
          open(si,'w').write(q)
          cb='src/pages/auth/Callback.tsx'; r=open(cb).read()
          old='      navigate(data.session ? "/app" : "/auth/sign-in", { replace: true });'
          assert r.count(old)==1
          r=r.replace(old,'      let to = "/app"; try { to = sessionStorage.getItem("rh_redirect") || "/app"; sessionStorage.removeItem("rh_redirect"); } catch {}\n      navigate(data.session ? to : "/auth/sign-in", { replace: true });')
          open(cb,'w').write(r)
          print('patched')
          PY
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: finds merged into home, /find/:shortcode detail page, login redirect back to listing, nav dedupe"
          git push
