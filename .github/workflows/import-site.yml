name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/fLpZd/site.zip -o site.zip
          echo "cb7f189ec6d6d718cad67152be9b62d1  site.zip" | md5sum -c -
          unzip -o site.zip
          python3 - <<'PY'
          p='src/App.tsx'; s=open(p).read()
          a='const Fit = React.lazy(() => import("./pages/Fit"));'
          b='          <Route path="/" element={<PageTransition><IndexNew /></PageTransition>} />'
          c='          <Route path="*" element={<PageTransition><NotFound /></PageTransition>} />'
          assert s.count(a)==1 and s.count(b)==1 and s.count(c)==1 and 'pages/Home"' not in s
          s=s.replace(a, a+'\nconst Home = React.lazy(() => import("./pages/Home"));\nconst Network = React.lazy(() => import("./pages/Network"));')
          s=s.replace(b, '          <Route path="/" element={<PageTransition><Home /></PageTransition>} />\n          <Route path="/score" element={<PageTransition><IndexNew /></PageTransition>} />')
          s=s.replace(c, '          <Route path="/network" element={<PageTransition><Network /></PageTransition>} />\n'+c)
          open(p,'w').write(s); print('App.tsx patched')
          PY
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: new deals home (/), /score keeps old home, /network partners landing"
          git push
