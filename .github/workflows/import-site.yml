name: import-site
on:
  push:
    paths: ['.github/workflows/import-site.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -X POST -o payload.zip https://temp.sh/NTKBl/site.zip
          echo '99f3dad0d2065d61a1157e390dfee801  payload.zip' | md5sum -c
          unzip -o payload.zip
          rm payload.zip .github/workflows/import-site.yml
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Add Grotte Santo Stefano (Viterbo) photos'
          git push
