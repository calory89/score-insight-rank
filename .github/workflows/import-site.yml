name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/hsvgl/site2.zip -o site.zip
          echo "5bc5f3738a9d4f362524b929183fa7e5  site.zip" | md5sum -c -
          unzip -oq site.zip
          python3 - <<'PY'
          p='src/App.tsx'; s=open(p).read()
          a='const Network = React.lazy(() => import("./pages/Network"));'
          c='          <Route path="*" element={<PageTransition><NotFound /></PageTransition>} />'
          assert s.count(a)==1 and s.count(c)==1 and 'pages/Finds' not in s
          s=s.replace(a, a+'\nconst Finds = React.lazy(() => import("./pages/Finds"));\nconst AdminActivity = React.lazy(() => import("./pages/AdminActivity"));')
          s=s.replace(c, '          <Route path="/finds" element={<PageTransition><Finds /></PageTransition>} />\n          <Route path="/admin/activity" element={<PageTransition><AdminActivity /></PageTransition>} />\n'+c)
          open(p,'w').write(s)
          n='src/components/realhunt/RHNav.tsx'; t=open(n).read()
          old='  { to: "/", label: "Score a property" },'
          assert t.count(old)==1
          t=t.replace(old,'  { to: "/", label: "Deals" },\n  { to: "/finds", label: "Spotted" },\n  { to: "/score", label: "Score a listing" },')
          t=t.replace('  { to: "/pricing", label: "Pricing" },','  { to: "/pricing", label: "Pricing" },\n  { to: "/network", label: "For developers" },')
          open(n,'w').write(t)
          cfg='supabase/config.toml'; k=open(cfg).read()
          if '[functions.import-finds]' not in k: open(cfg,'a').write('\n[functions.import-finds]\nverify_jwt = false\n')
          print('patched')
          PY
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: /finds (Instagram cheap homes, login-gated), /admin/activity, developer analyze form, nav, import-finds fn"
          git push
