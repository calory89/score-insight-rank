name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/YqvvK/site6.zip -o site.zip
          echo "9febc0fb9063fb971e2e7d23d911b6e4  site.zip" | md5sum -c -
          unzip -oq site.zip
          rm -f site.zip public/sync.txt .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: EBC first with new photo, no price overlay when price is in image, blue filters, login gate on detail, lead source in admin"
          git push
