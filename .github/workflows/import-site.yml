name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/vcLnp/site13.zip -o site.zip
          echo "5a31dc8bad7ff8770d7f861164f059b0  site.zip" | md5sum -c -
          unzip -oq site.zip
          # restore the original analyses Compare page overwritten by mistake
          git log --format=%H -- src/pages/Compare.tsx | sed -n 2p | xargs -I{} git show {}:src/pages/Compare.tsx > src/pages/Compare.tsx
          grep -q analyses src/pages/Compare.tsx
          python3 - <<'PY'
          a='src/App.tsx'; t=open(a).read()
          t=t.replace('const Compare = React.lazy(() => import("./pages/Compare"));\nconst Guide', 'const CompareHomes = React.lazy(() => import("./pages/CompareHomes"));\nconst Guide')
          t=t.replace('<Route path="/compare" element={<Compare />} />\n        <Route path="/guide/:country"', '<Route path="/compare-homes" element={<CompareHomes />} />\n        <Route path="/guide/:country"')
          assert t.count('const Compare = React.lazy') == 1 and '/compare-homes' in t
          open(a,'w').write(t); print('app fixed')
          PY
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "fix: restore analyses Compare page, homes comparator moved to /compare-homes"
          git push
