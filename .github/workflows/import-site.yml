name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/lmXNu/site4.zip -o site.zip
          echo "775317b935cea5ef6bced550d13fb7e9  site.zip" | md5sum -c -
          unzip -oq site.zip
          python3 - <<'PY'
          n='src/components/realhunt/RHNav.tsx'; t=open(n).read()
          i=t.index('const NAV_ITEMS = ['); j=t.index('];', i)+2
          t=t[:i]+'const NAV_ITEMS = [\n  { to: "/", label: "Deals" },\n  { to: "/network", label: "For developers" },\n];'+t[j:]
          open(n,'w').write(t); print('nav ok')
          PY
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: home shows only spotted homes under 200k, EBC cabin pinned second, minimal nav"
          git push
