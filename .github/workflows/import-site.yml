name: import-site
on:
  push:
    paths: [".github/workflows/import-site.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + apply
        run: |
          set -e
          curl -fsSL -X POST https://temp.sh/CVgtn/site8.zip -o site.zip
          echo "3a803f80e0b5af571c760cdd7a96a8be  site.zip" | md5sum -c -
          unzip -oq site.zip
          rm -f site.zip .github/workflows/import-site.yml
          git config user.name "realhunt-import"
          git config user.email "import@realhunt.co"
          git add -A
          git commit -m "feat: under 100k, ranked by cheapness for the place and photo quality, english captions and hooks, free-info gate copy"
          git push
