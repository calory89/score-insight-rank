name: rh-top100e
on:
  push:
    paths: ['.github/workflows/rh-top100e.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/InxXL/top.zip -o /tmp/p.zip
          echo "d4b11f38efe564f6bf0dd4a9b4078e72  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          npx -y esbuild@0.23.0 src/community/top.tsx --loader:.tsx=tsx --log-level=error > /dev/null
          for d in bali phuket tulum batumi; do python3 -c "import json;assert len(json.load(open('src/data/top-$d.json')))==100"; done
          git rm -q .github/workflows/rh-top100e.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Top 100: only developers with website + phone; rebuilt 4 rankings"
          git push
