name: rh-ui-2
on:
  push:
    paths: [.github/workflows/rh-ui-2.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -o p.zip https://litter.catbox.moe/aepp50.zip
          echo "df2317b8b74f02f9342311fa67f7633d  p.zip" | md5sum -c -
          unzip -o -q p.zip && rm -f p.zip
      - name: apply
        run: python3 patch_ui.py && rm -f patch_ui.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'community_availability_vote' src/community/Community.tsx
          grep -q 'hunt-chips' src/community/community.css
          ! grep -q 'No account needed to vote' src/community/Community.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-ui-2.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Country filter chips, crowd availability check on every listing, feature-your-listing link for agents"
          git push
