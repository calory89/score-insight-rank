name: rh-v6
on:
  push:
    paths: [.github/workflows/rh-v6.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/v6.zip https://temp.sh/glADS/v6.zip
          echo "1b0baa754682c41adc4b6b51f7e31291  /tmp/v6.zip" | md5sum -c -
          mkdir -p /tmp/v6 && unzip -o -q /tmp/v6.zip -d /tmp/v6
      - name: apply
        run: python3 /tmp/v6/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/extras.tsx src/community/v4.tsx src/community/v5.tsx src/community/v6.tsx src/community/minimap.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'PodiumHero' src/community/Community.tsx
          grep -q 'hv-podium' src/community/community.css
          test -s src/data/card-colors.json
      - name: commit
        run: |
          rm -f .github/workflows/rh-v6.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v6 visual pass: podium hero, vibe chips, rent comparison, gallery with zoom, map and nearby, amenities, video tour, confetti, brand type, colour placeholders, full-screen swipe, carousel, country pages, board collage and copy, profile grid, search suggestions, empty states"
          git push
