name: rh-publish
# Manual publish of realhunt.co. Same job as rh-auto-publish: builds and pushes straight to webs-estaticas
# over SSH (deploy key WEBS_DEPLOY_KEY). The old temp.sh package + rh-pub-import step is no longer needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    uses: ./.github/workflows/rh-auto-publish.yml
    secrets: inherit
