name: sort-como
on:
  push:
    paths: [".github/workflows/sort-como.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/QCNzv/fix12.zip -o fix12.zip
          echo "a053245d57f22f1352fc4a07903e281a  fix12.zip" | md5sum -c
          mkdir -p _f
          unzip -o fix12.zip -d _f
          cp _f/Home.tsx src/pages/Home.tsx
          cp _f/como-1.webp public/finds/como-1.webp
          cp _f/como-1-s.webp public/finds/como-1-s.webp
      - name: syntax-check
        run: npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null src/pages/Home.tsx
      - name: commit
        run: |
          rm -rf fix12.zip _f .github/workflows/sort-como.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Cheapest/Newest no longer pin promoted cards above cheaper homes; promoted Lake Como card last in the feed, opening the original Instagram post"
          git push
