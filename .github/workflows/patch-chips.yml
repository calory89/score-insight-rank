name: patch-chips
on:
  push:
    paths: [".github/workflows/patch-chips.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          p='src/community/Community.tsx'
          s=open(p).read()
          old='["", "Italy", "Japan", "Sweden", "France", "Spain"]'
          new='["", "Italy", "Spain", "Portugal"]'
          assert old in s, 'chips array not found'
          s=s.replace(old,new,1)
          open(p,'w').write(s)
          PY
          git rm -q .github/workflows/patch-chips.yml
          git config user.name "calory89"
          git config user.email "calory89@users.noreply.github.com"
          git add -A
          git commit -m "Country chips follow the live catalogue: Italy, Spain, Portugal"
          git push
