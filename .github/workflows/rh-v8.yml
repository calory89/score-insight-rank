name: rh-v8
on:
  push:
    paths: [.github/workflows/rh-v8.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/UBTKe/v8.zip
          echo "714bce4d256dcdd23d2814a1340f5cc7  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: syntax
        run: |
          for f in src/App.tsx src/community/Community.tsx src/community/v8.tsx src/community/v4.tsx src/community/extras.tsx src/pages/NetworkStart.tsx src/pages/DevPublic.tsx src/pages/NetworkApp.tsx src/pages/Network.tsx src/components/realhunt/DevGrowth.tsx vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'network/start' src/App.tsx
          grep -q 'DevBlock' src/community/Community.tsx
          grep -q '2026-09-24' src/lib/agreement.ts
          test -s public/badge/realhunt-partner.svg
      - name: commit
        run: |
          rm -f .github/workflows/rh-v8.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v8: developer onboarding from a link, projects in the feed, buyer requests to developers, public developer pages, verified badge, invites, bulk sharing, simulator"
          git push
