name: import-crm
on:
  push:
    paths:
      - '.github/workflows/import-crm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and apply
        run: |
          set -e
          curl -sSL -X POST -o payload.zip https://temp.sh/hfFhT/crm.zip
          echo "5b6c6c53258f7dad20601d73921601c0  payload.zip" | md5sum -c -
          unzip -o payload.zip -d .
          rm -f payload.zip
          python3 - << 'PY'
          p='src/App.tsx'; s=open(p).read()
          a='const NetworkApp = L(() => import("./pages/NetworkApp"));'
          assert a in s and 'pages/NetworkAgreement' not in s
          s=s.replace(a, a+'\nconst NetworkAgreement = L(() => import("./pages/NetworkAgreement"));')
          r='<Route path="/network/app" element={<NetworkApp />} />'
          assert r in s
          s=s.replace(r, '<Route path="/network/agreement" element={<NetworkAgreement />} />\n      '+r)
          open(p,'w').write(s)
          print('App.tsx patched')
          PY
          rm -f .github/workflows/import-finds.yml .github/workflows/import-finds2.yml .github/workflows/import-crm.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "feat: network agreement, buyer CRM, deals and 5/3 commissions, account overview" || echo "nothing to commit"
          git push
