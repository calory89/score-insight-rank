name: rh-v9
on:
  push:
    paths: [.github/workflows/rh-v9.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/qjgxL/v9.zip
          echo "d071b3a061edaac94b5e1d430476b3f3  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: syntax
        run: |
          for f in src/App.tsx src/community/Community.tsx src/community/v8.tsx src/community/v5.tsx src/community/extras.tsx src/pages/NetworkStart.tsx src/pages/DevPublic.tsx src/pages/NetworkApp.tsx src/pages/ClaimPage.tsx src/pages/NetworkAdmin.tsx src/pages/NetworkInvoice.tsx src/components/realhunt/DevGrowth.tsx vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
          python3 -m py_compile scripts/og_cards.py
      - name: guards
        run: |
          grep -q 'ClaimPage' src/App.tsx
          grep -q 'BuyerPicks' src/community/Community.tsx
          grep -q 'PhotoDrop' src/components/realhunt/DevGrowth.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v9.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v9: claim pages, listing claims, photo upload, payment plans and unit types, buyer consent, 48h rule with similar projects, ratings, matches, new-build pages, developer ranking, weekly report, CRM export, invoices, admin funnel"
          git push
