name: rh-ai-score
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-score every home"
        type: boolean
        default: false
      limit:
        description: "Max homes this run"
        default: "1000"
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: ["public/data/rh-static.json"]
permissions:
  contents: write
concurrency:
  group: rh-ai-score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score homes with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '1000' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 scripts/ai_score.py $ARGS
      - name: Commit results
        run: |
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add public/data/ai-scores.json public/data/ai-review.md
          git diff --cached --quiet || (git commit -m "AI score update [skip ci]" && git pull --rebase && git push)
