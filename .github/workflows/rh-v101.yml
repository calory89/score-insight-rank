name: rh-v101
on:
  push:
    paths: [.github/workflows/rh-v101.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/filLM/v101.zip
          echo "c0773d2401d6483b798618a1f432f276  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: syntax
        run: |
          for f in src/community/v8.tsx src/components/realhunt/DevExtras.tsx src/pages/NetworkAdmin.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
          grep -q 'Feature it free' src/components/realhunt/DevExtras.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v101.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v10.1: featured spot is free, in turns, one per country"
          git push
