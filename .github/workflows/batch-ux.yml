name: batch-ux
on:
  push:
    paths: [".github/workflows/batch-ux.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/wwehX/fix11.zip -o fix11.zip
          echo "233cef698c072c2523a1cf1dd16b9d23  fix11.zip" | md5sum -c
          mkdir -p _f
          unzip -o fix11.zip -d _f
          cp _f/Home.tsx src/pages/Home.tsx
          cp _f/rh.ts src/lib/rh.ts
          cp _f/AuthModal.tsx src/components/realhunt/AuthModal.tsx
          cp _f/CaptureInline.tsx src/components/realhunt/CaptureInline.tsx
          cp _f/patch_exit.py _f/patch_find.py _f/patch_ebc3.py .
      - name: patch
        run: |
          python3 patch_exit.py
          python3 patch_find.py
          python3 patch_ebc3.py
      - name: syntax-check
        run: |
          for f in src/pages/Home.tsx src/pages/FindDetail.tsx src/pages/Ebc.tsx src/lib/rh.ts src/components/realhunt/AuthModal.tsx src/components/realhunt/CaptureInline.tsx src/components/realhunt/EmailCapture.tsx; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          ! grep -rn "signInWithOAuth\|Continue with Google" src/ --exclude-dir=integrations || (echo "google back" && exit 1)
          grep -q "18000" src/lib/rh.ts || (echo "EBC price not set" && exit 1)
          ! grep -n 'h-full object-cover max-h' src/pages/FindDetail.tsx || (echo "gallery bug still there" && exit 1)
      - name: commit
        run: |
          rm -rf fix11.zip _f patch_exit.py patch_find.py patch_ebc3.py .github/workflows/batch-ux.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Sumba at 18k incl. land; capture with live social proof on every listing page; desktop exit intent; sort, search suggestions, scroll restore; resend and spam hint; listing gallery fixed cross-browser"
          git push
