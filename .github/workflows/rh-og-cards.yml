name: rh-og-cards
# Daily: fresh homes from the database (public/data), share cards for new homes, listing data for the prerender step.
on:
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow==11.0.0
      - name: refresh homes from the database
        run: python3 scripts/build_static.py
      # Every listing address ever published, so one that later drops under its minimum of homes can redirect
      # to its parent (seo/listings). Never stops the daily data.
      - name: remember listing addresses
        run: npx -y tsx@4 seo/listings/record.ts || true
      - run: python3 scripts/og_cards.py
      - name: commit if changed
        run: |
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add public/data public/og/deal src/data/deal-meta.json public/og-default-60k.jpg seo/listings/known-urls.json seo/listings/fx.json
          git diff --cached --quiet || (git commit -m "Daily data: homes, share cards and listing addresses" && git push)
      - name: ping IndexNow (Bing and others)
        run: python3 scripts/indexnow.py
  # Publish as soon as the day's data is in main (GitHub often starts scheduled runs hours late, so the
  # 16:40 publish could otherwise run before the new homes are committed).
  publish:
    needs: cards
    uses: ./.github/workflows/rh-auto-publish.yml
    secrets: inherit
