name: rh-og-cards
# Daily: fresh homes from the database (public/data), share cards for new homes, listing data for the prerender step.
on:
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow==11.0.0
      - name: refresh homes from the database
        run: python3 scripts/build_static.py
      - run: python3 scripts/search_pages.py
      - run: python3 scripts/og_cards.py
      - name: commit if changed
        run: |
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add public/data public/og/deal src/data/deal-meta.json public/og-default-60k.jpg src/data/search-pages.json src/data/search-static.json
          git diff --cached --quiet || (git commit -m "Daily data: homes, share cards, search pages and sitemap" && git push)
      - name: ping IndexNow (Bing and others)
        run: python3 scripts/indexnow.py
