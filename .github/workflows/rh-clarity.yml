name: rh-clarity
on:
  push:
    paths: [.github/workflows/rh-clarity.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/kRzEH/v72.zip
          echo "4d9fc56d100426e03915c011e6777ac2  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: syntax
        run: npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null src/pages/legal/Legal.tsx
      - name: guards
        run: |
          grep -q 'yn43cuf00q' index.html
          grep -q 'consentv2' index.html
          grep -q 'Microsoft Clarity' src/pages/legal/Legal.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-clarity.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Add Microsoft Clarity (cookieless until consent) and list it in the cookie and privacy policies"
          git push
