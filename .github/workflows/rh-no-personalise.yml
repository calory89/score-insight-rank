name: rh-no-personalise
on:
  push:
    paths: [.github/workflows/rh-no-personalise.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          python3 - <<'PY'
          p='src/community/Community.tsx'
          s=open(p).read()
          a='{index === 3 && <Personalise countries={Object.keys(feed?.countries_count || {})} onApply={setFilters} />}'
          assert s.count(a)==1, 'anchor missing'
          s=s.replace(a,'')
          open(p,'w').write(s)
          PY
      - name: syntax
        run: npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null src/community/Community.tsx
      - name: guards
        run: |
          ! grep -q '<Personalise' src/community/Community.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-no-personalise.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Remove the Where would you buy card from the feed"
          git push
