name: rh-v7
on:
  push:
    paths: [.github/workflows/rh-v7.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/v7.zip https://temp.sh/qhaXJ/v7.zip
          echo "8334fd3c30e51606c1f221dbf93d13be  /tmp/v7.zip" | md5sum -c -
          mkdir -p /tmp/v7 && unzip -o -q /tmp/v7.zip -d /tmp/v7
      - name: apply
        run: python3 /tmp/v7/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/v7.tsx src/community/v5.tsx src/community/extras.tsx src/App.tsx vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
      - name: live data (search pages, share cards, sitemap)
        run: |
          pip install pillow==11.0.0
          python3 scripts/search_pages.py
          python3 scripts/og_cards.py
      - name: guards
        run: |
          grep -q 'InsiderStrip' src/community/Community.tsx
          grep -q 'cheap-houses' vite.config.ts
          grep -q '/blog/' public/sitemap.xml
          grep -q '/cheap-houses/' public/sitemap.xml
          test "$(python3 -c 'import json;print(len(json.load(open("src/data/search-pages.json"))["pages"]))')" -ge 20
          test "$(python3 -c 'import json;print(len(json.load(open("src/data/blog.json"))))')" -ge 7
      - name: commit
        run: |
          rm -f .github/workflows/rh-v7.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v7: Insider early access, RealHunt Research blog, cheap-houses search pages, IndexNow"
          git push
