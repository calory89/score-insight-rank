name: import-exp
on:
  push:
    paths:
      - '.github/workflows/import-exp.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and apply
        run: |
          set -e
          curl -sSL -X POST -o payload.zip https://temp.sh/zGJXs/exp.zip
          echo "7d0281d78f1a87bea14f1ee3a20e1504  payload.zip" | md5sum -c -
          unzip -o payload.zip -d .
          rm -f payload.zip
          python3 - << 'PYEOF'
          import re
          # 1) rh.ts: export sid, enrich track() meta
          p='src/lib/rh.ts'; s=open(p).read()
          a='const sid = () => {'
          assert a in s and 'export const sid' not in s
          s=s.replace(a,'export const sid = () => {')
          old='''    await db.from("rh_events").insert({ sid: sid(), user_id: data.session?.user.id || null, event, path: location.pathname, find_shortcode: extra.find || null, meta: extra.meta || null });'''
          new='''    let exp: any = null, tz: string | null = null, internal = false;
              try { exp = JSON.parse(sessionStorage.getItem("rh_exp_assign") || "null"); } catch {}
              try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch {}
              try { if (new URLSearchParams(location.search).get("rh_me") === "1") localStorage.setItem("rh_internal", "1"); internal = localStorage.getItem("rh_internal") === "1"; } catch {}
              const meta = { ...(extra.meta || {}), ...(exp ? { exp } : {}), ...(tz ? { tz } : {}), ...(internal ? { internal: true } : {}) };
              await db.from("rh_events").insert({ sid: sid(), user_id: data.session?.user.id || null, event, path: location.pathname, find_shortcode: extra.find || null, meta });'''
          assert old in s; s=s.replace(old,new)
          open(p,'w').write(s); print('rh.ts patched')

          # 2) Home.tsx: headline experiment
          p='src/pages/Home.tsx'; s=open(p).read()
          imp='import { db, eur, FLAG, norm, slug, unslug, isNew, cleanCap, IG, EBC, MAX_PRICE, track, srcSet, score } from "@/lib/rh";'
          assert imp in s
          s=s.replace(imp, imp+'\nimport { useExperiment } from "@/lib/experiments";')
          a='  const [loaded, setLoaded] = useState(false);\n'
          assert a in s
          s=s.replace(a, a+'  const headline = useExperiment("home_headline", [{ id: "A", text: "Real homes under €100,000." }]);\n',1)
          old='country !== "All" ? <>Cheap homes in {country}.</> : <>Real homes under €100,000.</>}</h1>'
          assert old in s
          s=s.replace(old,'country !== "All" ? <>Cheap homes in {country}.</> : <>{headline.text || "Real homes under €100,000."}</>}</h1>')
          open(p,'w').write(s); print('Home.tsx patched')

          # 3) AdminActivity.tsx: experiments tab
          p='src/pages/AdminActivity.tsx'; s=open(p).read()
          a='import AdminNetwork from "@/components/realhunt/AdminNetwork";'
          assert a in s and 'AdminExperiments' not in s
          s=s.replace(a, a+'\nimport AdminExperiments from "@/components/realhunt/AdminExperiments";')
          old='{tab === "network" ? "RealHunt Network" : "Who is doing what"}'
          assert old in s
          s=s.replace(old,'{tab === "network" ? "RealHunt Network" : tab === "experiments" ? "Experiments" : "Who is doing what"}')
          old='[["", "Activity"], ["network", "Network CRM"]]'
          assert old in s
          s=s.replace(old,'[["", "Activity"], ["network", "Network CRM"], ["experiments", "Experiments"]]')
          old='{tab === "network" && <div className="mt-6"><AdminNetwork /></div>}'
          assert old in s
          s=s.replace(old, old+'\n          {tab === "experiments" && <div className="mt-6"><AdminExperiments /></div>}')
          s=s.replace('{tab !== "network" && <div className="mt-4 flex flex-wrap','{tab !== "network" && tab !== "experiments" && <div className="mt-4 flex flex-wrap')
          s=s.replace('        {tab !== "network" && <>','        {tab !== "network" && tab !== "experiments" && <>')
          open(p,'w').write(s); print('AdminActivity patched')

          PYEOF
          rm -f .github/workflows/import-exp.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "feat: A/B/n experiments engine + admin panel, network photos, headline/cta/photo/order tests" || echo "nothing to commit"
          git push
