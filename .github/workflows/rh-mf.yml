name: rh-mf
on:
  push:
    paths: ['.github/workflows/rh-mf.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download patch
        run: |
          curl -sSL -X POST https://temp.sh/nXJPB/mf.zip -o /tmp/p.zip
          echo 'a5d21b3167427f20d04d968b90d03e01  /tmp/p.zip' | md5sum -c
          mkdir -p /tmp/p && cd /tmp/p && unzip -q /tmp/p.zip
      - name: apply
        run: |
          python3 - <<'PY'
          import json,hashlib,os,shutil,sys
          base=json.load(open('/tmp/p/base.json')); bad=[]
          for f,h in base.items():
              if hashlib.md5(open(f,'rb').read()).hexdigest()!=h: bad.append(f)
          if bad: print('BASE MISMATCH',bad); sys.exit(1)
          for f in base: shutil.copy(os.path.join('/tmp/p',f),f)
          print('applied',len(base))
          PY
      - name: syntax check
        run: npx --yes esbuild@0.24.0 src/community/Community.tsx src/community/extras.tsx src/community/v6.tsx --outdir=/tmp/esb --log-level=error
      - name: commit
        run: |
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git rm -q .github/workflows/rh-mf.yml
          git add -A
          git commit -m 'Combinable filters: several countries at once, vibes switch on and off and combine with country, price and each other'
          git push
