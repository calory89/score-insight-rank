name: rh-ch
on:
  push:
    paths: ['.github/workflows/rh-ch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download patch
        run: |
          curl -sSL -X POST https://temp.sh/BnJuy/ch.zip -o /tmp/p.zip
          echo '6df8f134b5382183af5f8440d6696b4e  /tmp/p.zip' | md5sum -c
          mkdir -p /tmp/p && cd /tmp/p && unzip -q /tmp/p.zip
      - name: apply
        run: |
          python3 - <<'PY'
          import json,hashlib,os,shutil,sys
          base=json.load(open('/tmp/p/base.json')); bad=[]
          for f,h in base.items():
              if h is None:
                  if os.path.exists(f): bad.append(f+' (exists)')
                  continue
              if hashlib.md5(open(f,'rb').read()).hexdigest()!=h: bad.append(f)
          if bad: print('BASE MISMATCH',bad); sys.exit(1)
          for f in base:
              os.makedirs(os.path.dirname(f) or '.',exist_ok=True); shutil.copy(os.path.join('/tmp/p',f),f)
          print('applied',len(base))
          PY
      - name: syntax check
        run: npx --yes esbuild@0.24.0 src/lib/lang.ts --outdir=/tmp/esb --log-level=error
      - name: commit
        run: |
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git rm -q .github/workflows/rh-ch.yml
          git add -A
          git commit -m 'Switzerland: photos for 10 homes under EUR 100k, Spanish texts, Swiss region names in Spanish'
          git push
