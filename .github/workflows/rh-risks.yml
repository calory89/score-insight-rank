name: rh-risks
# Computes noise (motorways, railways, airports) and flood risk for every home from public sources
# (OpenStreetMap Overpass, OurAirports, FEMA, Open-Meteo, Natural Earth). Output is an artifact
# (risks.json) that an operator applies with: python3 scripts/risks.py --apply risks.json
on:
  workflow_dispatch:
    inputs:
      missing:
        description: "Only homes without road/rail data"
        default: "true"
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/risks.py --homes-url https://realhunt.co/data/rh-static.json --out risks.json ${{ github.event.inputs.missing == 'true' && '--missing' || '' }}
      - uses: actions/upload-artifact@v4
        with: { name: risks, path: risks.json, retention-days: 7 }
