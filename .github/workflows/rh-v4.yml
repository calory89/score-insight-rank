name: rh-v4
on:
  push:
    paths: [.github/workflows/rh-v4.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/v4.zip https://temp.sh/xnVPN/v4.zip
          echo "112d7a234055952b14c2c3b0a602805b  /tmp/v4.zip" | md5sum -c -
          mkdir -p /tmp/v4 && unzip -o -q /tmp/v4.zip -d /tmp/v4
      - name: apply
        run: python3 /tmp/v4/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/extras.tsx src/community/v4.tsx src/App.tsx src/components/realhunt/EmailCapture.tsx src/components/realhunt/CookieBanner.tsx src/components/realhunt/RHNav.tsx src/lib/rh.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'Card4' src/community/Community.tsx
          grep -q 'hv-tabbar' src/community/community.css
          grep -q 'ToFeed' src/App.tsx
          grep -q 'ixCount' src/components/realhunt/EmailCapture.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v4.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v4 UX: one feed, visual cards, double-tap to vote, story sharing, mobile tab bar and action bar, one notice at a time, instant loading, sponsored card lower"
          git push
