name: import-crm2
on:
  push:
    paths:
      - '.github/workflows/import-crm2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download and apply
        run: |
          set -e
          curl -sSL -X POST -o payload.zip https://temp.sh/wMJzH/crm2.zip
          echo "f2526abb0c2aeb9042f6ca8f87b67ef9  payload.zip" | md5sum -c -
          unzip -o payload.zip -d .
          rm -f payload.zip .github/workflows/import-crm2.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "copy: network options A/B/both and where the 5% goes" || echo "nothing to commit"
          git push
