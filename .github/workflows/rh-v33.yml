name: rh-v33
on:
  push:
    paths: [.github/workflows/rh-v33.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/mEkUM/v33.zip
          echo "303700898559885f726c9bd3586f91db  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - run: python3 /tmp/p/patch_v33.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/extras.tsx src/pages/Home.tsx src/lib/rh.ts vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
          grep -q 'HOME_MAX_PRICE = 100000' src/lib/rh.ts
          grep -q 'United States' src/lib/rh.ts
          test "$(ls public/og/deal | wc -l)" -ge 230
          test -f public/finds/glace-bay-86962-0.webp
      - name: commit
        run: |
          rm -f .github/workflows/rh-v33.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Homes under 100k: 101 new homes in the US, Canada and Mexico, costs and buyer rules per country, share cards"
          git push
