name: rh-v5
on:
  push:
    paths: [.github/workflows/rh-v5.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/v5.zip https://temp.sh/mwMTC/v5.zip
          echo "45987968ce233fc2a6a5b2c3650a7491  /tmp/v5.zip" | md5sum -c -
          mkdir -p /tmp/v5 && unzip -o -q /tmp/v5.zip -d /tmp/v5
      - name: apply
        run: python3 /tmp/v5/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/v4.tsx src/community/v5.tsx src/community/map.tsx src/App.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'ProfilePage' src/community/Community.tsx
          grep -q 'hv-welcome' src/community/community.css
          grep -q '/vs/:a/:b' src/App.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v5.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v5: auto-playing photos, social vote result, welcome screen, boards, compare two homes, map button, in-app notifications, profile with streaks and badges, swipe between homes, dark mode and page motion"
          git push
