name: rh-top100c
on:
  push:
    paths: ['.github/workflows/rh-top100c.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/cASzi/t.zip -o /tmp/p.zip
          echo "0b782c683c8eff4b021d35901eec7a21  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          for f in src/community/top.tsx src/community/Community.tsx src/pages/NetworkAdmin.tsx; do npx -y esbuild@0.23.0 "$f" --loader:.tsx=tsx --log-level=error > /dev/null; done
          git rm -q .github/workflows/rh-top100c.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Top 100: grades 60-90, developer verification with documents, developer panel"
          git push
