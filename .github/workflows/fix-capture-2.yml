name: fix-capture-2
on:
  push:
    paths: [".github/workflows/fix-capture-2.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/QBqVN/fix2.zip -o fix2.zip
          echo "fe831b45a882b7373805e5b713d3289b  fix2.zip" | md5sum -c
          unzip -o fix2.zip -d /tmp/f2
          cp /tmp/f2/EmailCapture.tsx src/components/realhunt/EmailCapture.tsx
      - name: commit
        run: |
          rm .github/workflows/fix-capture-2.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Email capture: read input value from DOM on submit to survive autofill desync"
          git push
