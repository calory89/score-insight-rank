name: rh-v10
on:
  push:
    paths: [.github/workflows/rh-v10.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/v10.zip https://temp.sh/oLOpU/v10.zip
          echo "145b4c047342dd34a3fa9c16eb4457fc  /tmp/v10.zip" | md5sum -c -
          mkdir -p /tmp/v10 && unzip -o -q /tmp/v10.zip -d /tmp/v10
      - name: apply
        run: python3 /tmp/v10/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/v10.tsx src/community/v8.tsx src/community/extras.tsx src/App.tsx src/pages/NetworkApp.tsx src/pages/NetworkAdmin.tsx src/pages/ClaimPage.tsx src/pages/Network.tsx src/pages/NetworkExample.tsx src/pages/ReservationContract.tsx src/components/realhunt/DevExtras.tsx src/components/realhunt/Reel.tsx src/components/realhunt/IntroChat.tsx vite.config.ts; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
          node -e "new Function(require('fs').readFileSync('public/embed.js','utf8'))"
      - name: sitemap
        run: |
          pip install pillow==11.0.0
          python3 scripts/og_cards.py
      - name: guards
        run: |
          grep -q 'InboxLink' src/community/Community.tsx
          grep -q '/costs/' vite.config.ts
          grep -q '/costs/albania' public/sitemap.xml
          grep -q 'IntroChat' src/pages/NetworkApp.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v10.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v10: buyer chat and inbox, serious buyer, questionnaire, saved alerts, compare new builds, real costs, monthly report, agents, featured spot, rank, widget, reel, example listing, reservation contract"
          git push
