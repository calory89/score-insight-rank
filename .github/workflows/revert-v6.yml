name: revert-v6
on:
  push:
    paths: ['.github/workflows/revert-v6.yml']
permissions:
  contents: write
jobs:
  rv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Revert
        run: |
          git config user.name 'top3hotels-bot'
          git config user.email 'bot@top3hotels.com'
          git rm -q .github/workflows/revert-v6.yml
          git commit -qm 'Remove revert workflow'
          git revert --no-edit 1a2abeb596cb21e620a3dfe0e99b600bdc682024 074a80eef8e0 607a4f93fec4
          git diff --stat 480ca34994b9 HEAD
          git pull --rebase -q
          git push
