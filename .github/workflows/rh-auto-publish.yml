name: rh-auto-publish
# Builds realhunt.co and publishes it straight to calory89/webs-estaticas (branch pub/_lovable, folder
# _s/realhunt.co plus new hashed files in assets/) over SSH with the deploy key WEBS_DEPLOY_KEY.
# No third-party upload in between (the old temp.sh bridge failed with 500s).
#
# Rules (same as rh-pub-import): changed files are updated; new assets and new realhunt.co files are added
# (never images: those are served by realhunt-media; the only images this job adds are the card thumbnails in
# _s/realhunt.co/t/, made by scripts/make_thumbs.py, add-only); nothing in _s/realhunt.co is deleted; old realhunt build files
# in the shared assets/ are removed once no file of any site references them (scripts/prune_shared_assets.py; on
# 7-nov-2026 the pile-up blocked every site's deploy); the deploy must stay under 95,000 (Cloudflare Pages paid plan: 100,000 files)
# files; every root folder and every site folder must still be in the commit before it is pushed.
#
# Runs right after rh-og-cards (it calls this when the day's data is committed), daily at 16:40 UTC as a backup, on pushes to main that touch the site, by hand,
# and from rh-publish (workflow_call).
on:
  schedule:
    - cron: "40 16 * * *"
  push:
    branches: [main]
    paths: ["src/**", "seo/**", "public/**", "index.html", "vite.config.ts", "package.json", "package-lock.json"]
  workflow_dispatch:
  workflow_call:
    secrets:
      WEBS_DEPLOY_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: rh-auto-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Always the latest main: when rh-og-cards calls this right after committing the day's data, the
      # caller's own sha would miss that commit.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Which commit is published
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build
        env:
          RH_COMMIT: ${{ steps.head.outputs.sha }}
          VITE_SUPABASE_URL: https://realhunt.co/__sb/realhunt
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95a2NzbWV4dGNscGRudWdpeHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzOTMzNjYsImV4cCI6MjEwNzk2OTM2Nn0.n4lmkzPgZe64B18altwRMYFiQrLQ2Quqg9uV9SoJhAw
          VITE_SUPABASE_PROJECT_ID: oykcsmextclpdnugixqz
        run: |
          npm ci --legacy-peer-deps
          # SEO checks (seo/polishAudit.ts) fail the build in CI (quality.yml); here they only warn, so a data oddity
          # in the daily import (two agencies, same title) never stops the site from publishing
          RH_SEO_SOFT=1 npx vite build
          grep -rl 'nylmhdtlshhtjkuvfbms.supabase.co' dist --include=*.html | xargs -r sed -i 's#https://nylmhdtlshhtjkuvfbms.supabase.co#https://realhunt.co/__sb/realhunt#g'
          if grep -rq 'nylmhdtlshhtjkuvfbms' dist/assets; then echo 'old supabase url still in bundle'; exit 1; fi
          test -f dist/index.html && test -f dist/sitemap.xml
      # Partial clone: only _s/realhunt.co and assets/ are written to disk; every other file stays in the
      # index (skip-worktree), so the commit keeps all other sites untouched.
      - name: Check out the deploy branch (partial)
        uses: actions/checkout@v4
        with:
          repository: calory89/webs-estaticas
          ref: pub/_lovable
          ssh-key: ${{ secrets.WEBS_DEPLOY_KEY }}
          sparse-checkout: |
            _s/realhunt.co
            assets
          path: webs
          fetch-depth: 1
      - name: Merge the build into the deploy tree
        run: |
          python3 - <<'PY'
          import os, shutil, filecmp
          src, dst = "dist", "webs"
          img = (".webp", ".jpg", ".jpeg", ".png", ".gif", ".mp4")
          upd = new = same = 0
          for root, _, files in os.walk(src):
              for f in files:
                  s = os.path.join(root, f); rel = os.path.relpath(s, src)
                  if rel.startswith("assets/"): d = os.path.join(dst, rel)
                  elif rel.lower().endswith(img): continue
                  else: d = os.path.join(dst, "_s/realhunt.co", rel)
                  if os.path.exists(d):
                      if filecmp.cmp(s, d, shallow=False): same += 1; continue
                      upd += 1
                  else: new += 1
                  os.makedirs(os.path.dirname(d), exist_ok=True); shutil.copy2(s, d)
          print(f"updated={upd} added={new} unchanged={same}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh: fh.write(f"realhunt.co: {upd} updated, {new} added, {same} unchanged\n")
          PY
      # 480 px WebP copies of the home photos for the cards (src/lib/thumbs.ts), written to _s/realhunt.co/t/ so
      # realhunt-media serves them. Add-only (existing thumbnails and photos are never touched); only new photos get
      # one, so after the first run this takes seconds. If it fails the publish goes on: cards fall back to the photo.
      # 21-nov-2026: every home of the snapshot gets its copies BEFORE this commit (the 800 px copy of the main photo
      # too, for every home), and t/index.txt lists every copy that exists. The daily snapshot (scripts/build_static.py)
      # marks each home with what the list holds and the app asks only for those, so a home newer than its copies
      # never asks for a missing one. The step is red (and the publish goes on) when a published home is left without
      # its copy; the output names it.
      - name: Card thumbnails (add-only)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --user pillow 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow
          python3 scripts/make_thumbs.py dist/data/rh-static.json public/finds webs/_s/realhunt.co
      - name: Commit, check and push
        working-directory: webs
        env:
          RH_SHA: ${{ steps.head.outputs.sha }}
        run: |
          git config user.name "realhunt-bot"; git config user.email "bot@realhunt.co"
          git add -A _s/realhunt.co assets
          # Replace, don't pile up: remove the old realhunt build files in the shared assets/ that nothing references
          # any more (all sites are scanned; manifest assets/.realhunt-manifest.txt; previous build kept 2 h).
          python3 "$GITHUB_WORKSPACE/scripts/prune_shared_assets.py" "$GITHUB_WORKSPACE/dist/assets" "$RH_SHA"
          echo "root assets/ files: $(git ls-files assets | grep -vc '/.*/')"
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "realhunt.co: auto-publish score-insight-rank ${RH_SHA::7}"
          check() {
            total=$(git ls-tree -r --name-only HEAD | wc -l)
            echo "files in deploy: $total"
            [ "$total" -le 95000 ] || { echo "too many files for Cloudflare Pages ($total)"; return 1; }
            # 26 Nov 2026: the Pages project realhunt-media (serves realhunt.co, root _s/realhunt.co) is capped at
            # 20,000 files by the account's plan, and its build step adds the shared assets the pages need (about as many
            # as dist/assets). Over the cap every deploy fails and the site keeps serving an old build without warning
            # (15:13-19:00 UTC that day). Stop here instead, with the numbers.
            rh=$(git ls-tree -r --name-only HEAD -- _s/realhunt.co | wc -l); ra=$(find "$GITHUB_WORKSPACE/dist/assets" -type f | wc -l)
            echo "realhunt-media deploy: $rh files + about $ra shared assets = $((rh + ra)) (limit 20,000, guard 19,600)"
            [ $((rh + ra)) -le 19600 ] || { echo "realhunt-media would go over the 20,000-file limit of Cloudflare Pages: bundle more pages (seo/pack.ts) before publishing"; return 1; }
            for t in "" "_s/"; do
              before=$(git ls-tree --name-only "HEAD~1:$t" | sort); after=$(git ls-tree --name-only "HEAD:$t" | sort)
              missing=$(comm -23 <(echo "$before") <(echo "$after"))
              [ -z "$missing" ] || { echo "folders missing in /$t: $missing"; return 1; }
            done
            # realhunt-media (the photos) is built from _s/realhunt.co on this branch: photos must never go down.
            ib=$(git ls-tree -r --name-only HEAD~1 -- _s/realhunt.co | grep -ciE '\.(webp|jpe?g|png)$' || true)
            ia=$(git ls-tree -r --name-only HEAD -- _s/realhunt.co | grep -ciE '\.(webp|jpe?g|png)$' || true)
            echo "realhunt photos: $ib -> $ia"
            [ "$ia" -ge "$ib" ] || { echo "realhunt photos would drop from $ib to $ia"; return 1; }
          }
          check
          for i in 1 2 3 4 5; do
            if git push origin HEAD:pub/_lovable; then echo "published $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY; exit 0; fi
            git pull --rebase -q origin pub/_lovable && check
            sleep 5
          done
          exit 1
      - name: Tell search engines (IndexNow)
        run: python3 scripts/indexnow.py || true
      - name: Check the live site (build live, sitemap, key pages, every sitemap URL)
        run: python3 scripts/post_publish_check.py "${{ steps.head.outputs.sha }}"
      - name: Check every asset the live pages load (realhunt.co and go.realhunt.co)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_live_assets.py
      # 15-nov-2026: what a search engine gets from the live site (old addresses in one hop, 50 pages read without
      # scripts as Googlebot, crawlers not challenged, compression, cache). Never blocks: it only reports.
      - name: Check the live site as a search engine sees it (report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        run: node seo/tech/liveCheck.mjs
      # 21-nov-2026 (ideas 5, 65, 81 and 87 of the second list): 30 pages in headless Chrome, one after the other like a
      # visitor (fails on our own console errors, 404s on our hosts, photos that do not load, a home page without its
      # main photo), the weight of the five page types against seo/tech/perf-budget.json "live", and 20 home pages
      # served from the bundles with their title and canonical. Chrome is the one on the runner; only playwright-core
      # is installed for it (not saved in package.json).
      - name: Check the live site in a browser (console errors, 404s, photos, weight, bundled home pages)
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          npm i --no-save --no-audit --no-fund --legacy-peer-deps playwright-core@1.63.0 > /dev/null
          RH_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)" node seo/tech/browserCheck.mjs
