name: ebc-photo
on:
  push:
    paths: [".github/workflows/ebc-photo.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/YlWeY/imgfix.zip -o imgfix.zip
          echo "476534197e82845e7e97c13165944d1e  imgfix.zip" | md5sum -c
          mkdir -p _imgfix
          unzip -o imgfix.zip -d _imgfix
          mkdir -p public/images/ebc
          cp _imgfix/ebc-card.webp public/images/ebc/ebc-card.webp
          cp _imgfix/ebc-card-s.webp public/images/ebc/ebc-card-s.webp
          rm -rf imgfix.zip _imgfix
      - name: commit
        run: |
          rm .github/workflows/ebc-photo.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Update Mamboro Sumba card photo"
          git push
