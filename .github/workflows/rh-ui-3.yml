name: rh-ui-3
on:
  push:
    paths: [.github/workflows/rh-ui-3.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -o p.zip https://litter.catbox.moe/m4rlob.zip
          echo "300b2caa415f9d17ddb059089502f94c  p.zip" | md5sum -c -
          unzip -o -q p.zip && rm -f p.zip
      - name: apply
        run: python3 patch_ui.py && rm -f patch_ui.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
      - name: guards
        run: |
          grep -q 'No account needed to vote' src/community/Community.tsx
          ! grep -q 'rh_pending_vote", deal.id' src/community/Community.tsx
          grep -q 'hunt-avail' src/community/Community.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-ui-3.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Voting is open to everyone again; the account es only asked when opening the original listing"
          git push
