name: export-src
on:
  workflow_dispatch:
    inputs:
      paths:
        default: "."
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        env:
          P: ${{ github.event.inputs.paths }}
        run: |
          echo "MANIFESTS:"; find . -name manifest.json -not -path './node_modules/*' | head -20
          tar --exclude=./.git --exclude=./node_modules --exclude='*.webp' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.png' --exclude='*.mp4' -czf /tmp/src.tgz $P
          ls -la /tmp/src.tgz
          URL=$(curl -s -F "file=@/tmp/src.tgz" https://temp.sh/upload)
          echo "EXPORT_URL=$URL"
