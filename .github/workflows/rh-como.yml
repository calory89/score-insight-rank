name: rh-como
on:
  push:
    paths: [.github/workflows/rh-como.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/wueCP/como.zip
          echo "27b2ad862192cd7d6dd6593fcdd751ee  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py && ls public/finds/lake-como-peglio-85000-*
      - name: commit
        run: |
          rm -f .github/workflows/rh-como.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m 'Add Lake Como Peglio listing photos'
          git push
