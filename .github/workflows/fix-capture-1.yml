name: fix-capture-1
on:
  push:
    paths: [".github/workflows/fix-capture-1.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/EVjAX/fix1.zip -o fix1.zip
          echo "01a01179c82a011ac551acf4b427a795  fix1.zip" | md5sum -c
          unzip -o fix1.zip -d /tmp/f1
          cp /tmp/f1/EmailCapture.tsx src/components/realhunt/EmailCapture.tsx
      - name: commit
        run: |
          rm .github/workflows/fix-capture-1.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Email capture: swallow backend errors on submit, honest success copy"
          git push
