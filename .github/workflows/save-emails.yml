name: save-emails
on:
  push:
    paths: [".github/workflows/save-emails.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/aSxHW/fix8.zip -o fix8.zip
          echo "f5bd2ea1e8b4890063d94a161687e31d  fix8.zip" | md5sum -c
          mkdir -p _fix8
          unzip -o fix8.zip -d _fix8
          cp _fix8/Home.tsx src/pages/Home.tsx
          cp _fix8/rh.ts src/lib/rh.ts
          cp _fix8/patch_capture.py patch_capture.py
      - name: patch
        run: python3 patch_capture.py
      - name: syntax-check
        run: |
          for f in src/pages/Home.tsx src/lib/rh.ts src/components/realhunt/EmailCapture.tsx; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: commit
        run: |
          rm -rf fix8.zip _fix8 patch_capture.py .github/workflows/save-emails.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Critical: subscriber emails were being dropped. Upsert is rejected by RLS for anonymous visitors, so use a plain insert and only confirm when it saved"
          git push
