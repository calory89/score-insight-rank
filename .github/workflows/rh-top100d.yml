name: rh-top100d
on:
  push:
    paths: ['.github/workflows/rh-top100d.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/UbdXD/t4.zip -o /tmp/p.zip
          echo "cc3d5c99238269fb57199f25bbd0b316  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          for f in src/community/top.tsx src/community/Community.tsx src/App.tsx src/pages/NetworkAdmin.tsx; do npx -y esbuild@0.23.0 "$f" --loader:.tsx=tsx --log-level=error > /dev/null; done
          python3 -c "import ast;ast.parse(open('scripts/og_cards.py').read())"
          python3 -c "import json;[json.load(open(f'src/data/top-{k}.json')) for k in ('phuket','tulum','batumi')]"
          test -f public/top/phuket/og.jpg && test -f public/top/tulum/og.jpg && test -f public/top/batumi/og.jpg
          git rm -q .github/workflows/rh-top100d.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Top 100 rankings for Phuket, Tulum and Batumi, rankings index, contacts in admin"
          git push
