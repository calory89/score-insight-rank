name: rh-brand
on:
  push:
    paths: ['.github/workflows/rh-brand.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download patch
        run: |
          curl -sSL -X POST https://temp.sh/XRBLx/brand.zip -o /tmp/p.zip
          echo '618c17f5802e53eb4209572e8d939add  /tmp/p.zip' | md5sum -c
          mkdir -p /tmp/p && cd /tmp/p && unzip -q /tmp/p.zip
      - name: apply
        run: |
          cd /tmp/p && find . -type f ! -name apply.py ! -name base.json | while read f; do mkdir -p "$GITHUB_WORKSPACE/$(dirname $f)"; done
          cd "$GITHUB_WORKSPACE" && cp /tmp/p/base.json /tmp/p/apply.py . && python3 - <<'PY'
          import json,hashlib,os,shutil,sys
          base=json.load(open('base.json')); bad=[]
          for f,h in base.items():
              if h is None:
                  if os.path.exists(f): bad.append(f+' (exists)')
                  continue
              if hashlib.md5(open(f,'rb').read()).hexdigest()!=h: bad.append(f)
          if bad: print('BASE MISMATCH',bad); sys.exit(1)
          for f in base:
              os.makedirs(os.path.dirname(f) or '.',exist_ok=True); shutil.copy(os.path.join('/tmp/p',f),f)
          print('applied',len(base))
          PY
          rm -f base.json apply.py
      - name: syntax check
        run: npx --yes esbuild@0.24.0 src/lib/lang.ts src/community/Community.tsx src/community/extras.tsx src/community/i18n.ts src/community/v7.tsx src/main.tsx src/components/realhunt/Logo.tsx src/components/realhunt/OriginalListingLink.tsx src/components/realhunt/RHNav.tsx --outdir=/tmp/esb --log-level=error
      - name: commit
        run: |
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git rm -q .github/workflows/rh-brand.yml
          git add -A
          git commit -m 'Spanish for Spain and Spanish-speaking visitors, new orange brand and logo, Zillow-style cards, open Fotocasa links, founder label on EBC card'
          git push
