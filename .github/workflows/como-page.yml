name: como-page
on:
  push:
    paths: [.github/workflows/como-page.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch payload
        run: |
          curl -sSL -X POST -o p.zip https://temp.sh/TwZTc/como.zip
          echo "f196efe8edfceb02cf5675bb3bdb4a2d  p.zip" | md5sum -c -
          unzip -o -q p.zip
          rm -f p.zip
      - name: apply
        run: python3 patch_como.py && rm -f patch_como.py
      - name: syntax check
        run: |
          npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --outfile=/dev/null src/pages/Como.tsx
          npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --outfile=/dev/null src/pages/Home.tsx
          npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --outfile=/dev/null src/App.tsx
      - name: guards
        run: |
          grep -q 'path="/lake-como"' src/App.tsx
          grep -q 'to="/lake-como"' src/pages/Home.tsx
          grep -q 'idealista.it/es/immobile/36683836' src/pages/Como.tsx
          ! grep -q 'COMO_URL' src/pages/Home.tsx
          ! grep -q 'ExternalLink' src/pages/Home.tsx
      - name: commit
        run: |
          rm -f .github/workflows/como-page.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Lake Como: own listing page at /lake-como, outbound link now goes to the idealista listing"
          git push
