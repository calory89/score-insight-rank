name: rh-v31
on:
  push:
    paths: [.github/workflows/rh-v31.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch
        run: |
          curl -sSL -o /tmp/p.zip https://litter.catbox.moe/onw6ko.zip
          echo "014b65857719afaec85f54183e28acc6  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - run: python3 /tmp/p/patch_v31.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/extras.tsx src/community/map.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --outfile=/dev/null "$f"
          done
          grep -q 'hunt-filter-toggle' src/community/extras.tsx
      - name: commit
        run: |
          rm -f .github/workflows/rh-v31.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "Mobile filters fold away, page titles, rent line, similar homes grid"
          git push
