name: finds-photos
on:
  push:
    paths: [.github/workflows/finds-photos.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch payload
        run: |
          curl -sSL -X POST -o payload.zip https://temp.sh/eNLLN/finds_photos.zip
          echo "d378ef01f753dbbe57ddd96943715b4c  payload.zip" | md5sum -c -
      - name: unpack
        run: |
          unzip -o -q payload.zip
          rm -f payload.zip
          ls public/finds/*.webp | wc -l
      - name: guard
        run: |
          test "$(ls public/finds/*.webp | wc -l)" -ge 300
      - name: commit
        run: |
          rm -f .github/workflows/finds-photos.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "finds: photos for 93 new listings under 60k"
          git push
