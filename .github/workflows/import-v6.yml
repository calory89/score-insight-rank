name: import-v6
on:
  push:
    paths: ['.github/workflows/import-v6.yml']
permissions:
  contents: write
jobs:
  imp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import
        run: |
          curl -sfL -o /tmp/p.zip 'https://tmpfiles.org/dl/1791559497.13bc3592a4a262ff/w6APgsILOp1p/push12.zip'
          echo '1b9950e5e9334c392113b582109bcbb4  /tmp/p.zip' | md5sum -c
          unzip -o /tmp/p.zip
          git rm -q .github/workflows/import-v6.yml
          echo 'v6a 2026-10-09' > public/sync.txt
          git config user.name 'top3hotels-bot'
          git config user.email 'bot@top3hotels.com'
          git add -A src work public
          git commit -qm 'Fix home map re-render, stale note, lang banner overlap; London guide layout'
          git pull --rebase -q
          git push
