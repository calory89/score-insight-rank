name: rh-top100b
on:
  push:
    paths: ['.github/workflows/rh-top100b.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          curl -sSL -X POST https://temp.sh/gMTAA/a.zip -o /tmp/p.zip
          echo "716cb92091ca3936b147c871eef483b7  /tmp/p.zip" | md5sum -c
          mkdir -p /tmp/p && unzip -q /tmp/p.zip -d /tmp/p
          python3 /tmp/p/apply.py
          npx -y esbuild@0.23.0 src/pages/NetworkAdmin.tsx --loader:.tsx=tsx --log-level=error > /dev/null
          git rm -q .github/workflows/rh-top100b.yml
          git config user.name realhunt-bot
          git config user.email bot@realhunt.co
          git add -A
          git commit -qm "Admin: questions from the Bali Top 100"
          git push
